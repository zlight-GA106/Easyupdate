{{template "head" .}}
<div class="page-heading"><h1>{{.Title}}</h1></div>
<section class="panel">
  <div class="panel-title">确认删除</div>
  <form method="post" class="form-panel">
    {{template "csrf" .}}
    {{if .DeleteNotice}}<p class="notice error">{{.DeleteNotice}}</p>{{end}}
    <p>请输入 <strong class="mono">{{.ConfirmName}}</strong></p>
    <input type="text" name="confirmation" aria-label="删除确认" required autocomplete="off">
    <div class="actions">
      <button type="submit" class="button danger default">删除</button>
      <a class="button" href="{{.Back}}">取消</a>
    </div>
  </form>
</section>
{{template "foot" .}}
