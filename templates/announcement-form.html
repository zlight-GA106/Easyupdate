{{template "head" .}}<div class="page-heading"><h1>{{.Title}}</h1></div><section class="panel"><div class="panel-title">公告内容</div><form method="post" class="form-panel">{{template "csrf" .}}<label>标题<input name="title" value="{{.Item.Title}}" maxlength="200" required></label><label>内容<textarea name="content" rows="8" maxlength="16384" required>{{.Item.Content}}</textarea></label><label class="check"><input type="checkbox" name="published" {{if .Item.Published}}checked{{end}}> 发布</label><div class="actions"><button class="button primary">保存</button><a class="button" href="/admin/announcements">取消</a></div></form></section>{{template "foot" .}}
