{{template "head" .}}
<div class="page-heading"><h1>{{.Title}}</h1></div>
<section class="panel">
  <div class="panel-title">公告内容</div>
  <form method="post" class="form-panel">
    {{template "csrf" .}}
    <label>标题<input type="text" name="title" value="{{.Item.Title}}" maxlength="200" required></label>
    <label>内容<textarea name="content" rows="8" maxlength="16384" required>{{.Item.Content}}</textarea></label>
    <div class="check">
      <input type="checkbox" id="announcement-published" name="published" {{if .Item.Published}}checked{{end}}>
      <label for="announcement-published">发布</label>
    </div>
    <div class="actions">
      <button type="submit" class="button primary default">保存</button>
      <a class="button" href="/admin/announcements">取消</a>
    </div>
  </form>
</section>
{{template "foot" .}}
