{{template "head" .}}<div class="page-heading"><h1>应用</h1><a class="button primary" href="/admin/apps/new">＋ 新建应用</a></div><section class="panel"><div class="panel-title">应用列表 <span>{{len .Apps}}</span></div>{{if .Apps}}<div class="table-wrap"><table><thead><tr><th>应用</th><th>包名</th><th>最新版本</th><th>版本数</th><th></th></tr></thead><tbody>{{range .Apps}}<tr><td><a class="app-name" href="/admin/apps/{{.ID}}"><span class="app-icon">{{initial .Name}}</span>{{.Name}}</a></td><td class="mono">{{.PackageName}}</td><td>{{if .LatestVersion}}{{.LatestVersion}}{{else}}—{{end}}</td><td>{{.ReleaseCount}}</td><td><a href="/admin/apps/{{.ID}}">打开 →</a></td></tr>{{end}}</tbody></table></div>{{else}}<div class="empty">暂无应用<a href="/admin/apps/new">新建应用 →</a></div>{{end}}</section>{{template "foot" .}}
