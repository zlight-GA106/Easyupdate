{{template "head" .}}
<div class="page-heading">
  <h1>上传 APK</h1>
  <a class="button" href="/admin/apps/{{.App.ID}}">返回应用</a>
</div>
<section class="panel">
  <div class="panel-title">{{.App.Name}} <span class="mono">{{.App.PackageName}}</span></div>
  <form method="post" enctype="multipart/form-data" class="form-panel" data-upload>
    {{template "csrf" .}}
    <label class="file-picker">APK 文件<input type="file" name="apk" accept=".apk,application/vnd.android.package-archive" required></label>
    <div class="actions">
      <button type="submit" class="button primary default">上传</button>
      <span class="upload-status" role="status"></span>
    </div>
    <div role="progressbar" class="marquee upload-progress" data-upload-progress aria-label="上传 APK" hidden></div>
  </form>
</section>
{{template "foot" .}}
