{{define "github-source"}}
<section class="panel">
  <div class="panel-title">GitHub 来源 {{if .Source.LastCheckedAt}}<span>{{date .Source.LastCheckedAt}}</span>{{end}}</div>
  <form method="post" action="/admin/apps/{{.App.ID}}/github" class="form-panel">
    {{template "csrf" .}}
    <div class="form-row">
      <label>Owner<input type="text" name="owner" value="{{.Source.Owner}}" placeholder="zlight-GA106" maxlength="39" required></label>
      <label>Repository<input type="text" name="repo" value="{{.Source.Repo}}" placeholder="EasyCent" maxlength="100" required></label>
    </div>
    <label>APK 匹配规则<input type="text" name="asset_pattern" value="{{if .Source.AssetPattern}}{{.Source.AssetPattern}}{{else}}*.apk{{end}}" maxlength="128" required></label>
    <div class="check">
      <input type="checkbox" id="github-enabled" name="enabled" {{if .Source.Enabled}}checked{{end}}>
      <label for="github-enabled">启用</label>
    </div>
    <button type="submit" class="button default">保存来源</button>
  </form>
  {{if .Source.Enabled}}
  <form method="post" action="/admin/apps/{{.App.ID}}/sync" class="sync-action">
    {{template "csrf" .}}
    <button type="submit" class="button primary default">同步 GitHub</button>
  </form>
  {{end}}
</section>
{{end}}
