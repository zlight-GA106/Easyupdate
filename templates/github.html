{{define "github-source"}}<section class="panel"><div class="panel-title">GitHub 来源 {{if .Source.LastCheckedAt}}<span>{{date .Source.LastCheckedAt}}</span>{{end}}</div><form method="post" action="/admin/apps/{{.App.ID}}/github" class="form-panel">{{template "csrf" .}}<div class="form-row"><label>Owner<input name="owner" value="{{.Source.Owner}}" placeholder="zlight-GA106" maxlength="39" required></label><label>Repository<input name="repo" value="{{.Source.Repo}}" placeholder="EasyCent" maxlength="100" required></label></div><label>APK 匹配规则<input name="asset_pattern" value="{{if .Source.AssetPattern}}{{.Source.AssetPattern}}{{else}}*.apk{{end}}" maxlength="128" required></label><label class="check"><input type="checkbox" name="enabled" {{if .Source.Enabled}}checked{{end}}> 启用</label><button class="button">保存来源</button></form>{{if .Source.Enabled}}<form method="post" action="/admin/apps/{{.App.ID}}/sync" class="sync-action">{{template "csrf" .}}<button class="button primary">同步 GitHub</button></form>{{end}}</section>{{end}}
