{{template "head" .}}
<div class="page-heading">
  <h1>公告</h1>
  <a class="button primary" href="/admin/announcements/new">＋ 新建公告</a>
</div>
<section class="panel">
  <div class="panel-title">公告列表 <span>{{len .Items}}</span></div>
  {{if .Items}}
  <div class="table-wrap">
    <table class="records-table" role="table">
      <thead><tr><th>标题</th><th>状态</th><th>创建时间</th><th class="record-actions">操作</th></tr></thead>
      <tbody>
        {{range .Items}}
        <tr>
          <td data-label="标题"><a href="/admin/announcements/{{.ID}}/edit">{{.Title}}</a></td>
          <td data-label="状态"><span class="badge {{if .Published}}published{{else}}draft{{end}}">{{if .Published}}已发布{{else}}草稿{{end}}</span></td>
          <td data-label="创建时间">{{date .CreatedAt}}</td>
          <td data-label="操作" class="record-actions">
            <div class="row-actions">
              <a class="button" href="/admin/announcements/{{.ID}}/edit">编辑</a>
              <form method="post" action="/admin/announcements/{{.ID}}/publish">
                <input type="hidden" name="csrf" value="{{$.CSRF}}">
                {{if .Published}}
                <button type="submit" class="button" name="action" value="unpublish">取消发布</button>
                {{else}}
                <button type="submit" class="button" name="action" value="publish">发布</button>
                {{end}}
              </form>
              <a class="button danger" href="/admin/announcements/{{.ID}}/delete">删除</a>
            </div>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
  {{else}}
  <div class="empty">暂无公告</div>
  {{end}}
</section>
{{template "foot" .}}
