{{template "head" .}}
<div class="page-heading"><h1>确认版本</h1></div>
<section class="panel">
  <div class="panel-title">{{.App.Name}} <span>{{size .Upload.File.Size}}</span></div>
  <form method="post" action="/admin/apps/{{.App.ID}}/releases" class="form-panel">
    {{template "csrf" .}}
    <input type="hidden" name="upload_token" value="{{.Token}}">
    {{if not .Metadata.Source}}<div class="notice">未读取到完整元数据，请手动确认。</div>{{end}}
    {{if .Upload.Tag}}
    <p>GitHub · <span class="mono">{{.Upload.Tag}}</span></p>
    {{if .TagMismatch}}<p class="notice warning">Tag 与 APK 版本不一致。</p>{{end}}
    {{end}}
    <label>包名<input type="text" name="package_name" value="{{.Metadata.PackageName}}" maxlength="255" required {{if .Metadata.PackageName}}readonly{{end}}></label>
    <div class="form-row">
      <label>版本名称<input type="text" name="version_name" value="{{.Metadata.VersionName}}" maxlength="128" required {{if .Metadata.VersionName}}readonly{{end}}></label>
      <label>版本号<input type="number" name="version_code" min="1" max="2147483647" value="{{if .Metadata.VersionCode}}{{.Metadata.VersionCode}}{{end}}" required {{if .Metadata.VersionCode}}readonly{{end}}></label>
    </div>
    <label>版本说明<textarea name="release_notes" rows="5" maxlength="16384">{{.Upload.Notes}}</textarea></label>
    <div class="check">
      <input type="checkbox" id="upload-mandatory" name="mandatory">
      <label for="upload-mandatory">强制更新</label>
    </div>
    <label>SHA256<output class="hash mono">{{.Upload.File.SHA256}}</output></label>
    <div class="actions">
      <button type="submit" class="button primary default" name="action" value="create">创建草稿</button>
      <button type="submit" class="button" name="action" value="cancel" formnovalidate>取消</button>
    </div>
  </form>
</section>
{{template "foot" .}}
