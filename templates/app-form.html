{{template "head" .}}<div class="page-heading"><h1>{{.Title}}</h1></div><section class="panel"><div class="panel-title">应用信息</div><form method="post" class="form-panel">{{template "csrf" .}}<label>名称<input name="name" value="{{.App.Name}}" maxlength="128" required></label><label>包名<input name="package_name" value="{{.App.PackageName}}" placeholder="com.zlight106.easycent" maxlength="255" required></label><label>描述<textarea name="description" rows="4" maxlength="4096">{{.App.Description}}</textarea></label><div class="actions"><button class="button primary">保存</button><a class="button" href="/admin/apps">取消</a></div></form></section>{{template "foot" .}}
