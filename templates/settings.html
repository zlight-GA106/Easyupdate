{{template "head" .}}<div class="page-heading"><h1>设置</h1></div><section class="panel"><div class="panel-title">服务器</div><dl class="details"><dt>公开地址</dt><dd class="mono">{{.PublicURL}}</dd><dt>监听地址</dt><dd class="mono">{{.Listen}}</dd><dt>上传上限</dt><dd>{{.MaxUploadMB}} MB</dd><dt>数据库</dt><dd class="mono">{{.DatabasePath}}</dd><dt>APK 存储</dt><dd class="mono">{{.StoragePath}}</dd><dt>GitHub Token</dt><dd>{{if .GitHubTokenConfigured}}已配置{{else}}未配置{{end}}</dd></dl></section><section class="panel"><div class="panel-title">管理员</div><dl class="details"><dt>账号</dt><dd>{{.Username}}</dd><dt>配置文件</dt><dd class="mono">{{.ConfigPath}}</dd></dl><p class="panel-note">修改配置后重启服务。</p></section>{{template "foot" .}}
