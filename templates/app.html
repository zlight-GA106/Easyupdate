{{template "head" .}}<div class="page-heading"><div class="app-heading"><span class="app-icon large">{{initial .App.Name}}</span><div><h1>{{.App.Name}}</h1><p class="mono muted">{{.App.PackageName}}</p></div></div><a class="button" href="/admin/apps/{{.App.ID}}/edit">编辑应用</a></div>{{if .App.Description}}<p class="description">{{.App.Description}}</p>{{end}}<section class="panel"><div class="panel-title">版本</div><div class="empty">暂无版本</div></section><div class="actions"><a class="danger-link" href="/admin/apps/{{.App.ID}}/delete">删除应用</a></div>{{template "foot" .}}
