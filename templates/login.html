<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · EasyUpdate</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/vendor/7css/7.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-window window glass active">
    <header class="title-bar app-title-bar">
      <div class="title-bar-text"><img src="/static/logo.svg" width="16" height="16" alt=""><span>EasyUpdate</span></div>
    </header>
    <div class="login-content window-body">
      <img src="/static/logo.svg" width="60" height="60" alt="">
      <h1>EasyUpdate</h1>
      <p class="muted">ZLIGHT106 Microsystems</p>
      {{if .Error}}<div class="notice error" role="alert">{{.Error}}</div>{{end}}
      <form method="post" action="/login">
        {{template "csrf" .}}
        <fieldset class="login-fields">
          <legend>登录</legend>
          <label for="login-username">账号</label>
          <input id="login-username" type="text" name="username" autocomplete="username" maxlength="128" required autofocus>
          <label for="login-password">密码</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
        </fieldset>
        <button class="button primary default" type="submit">登录</button>
      </form>
    </div>
  </main>
</body>
</html>
